  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      padding: 0;
    }

    /* Kata trigger */
    #triggerWord {
      font-size: 2em;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      color: #333;
      display: inline-block;
    }

    /* Gambar target */
    #targetImage {
      width: 300px;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    /* Animasi Zoom */
    .zoom {
      animation: zoom 2s ease-in-out forwards;
    }
    @keyframes zoom {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Animasi Rotate ke kanan */
    .rotate-right {
      animation: rotateRight 2s ease-in-out forwards;
    }
    @keyframes rotateRight {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }

    /* Animasi Rotate ke kiri */
    .rotate-left {
      animation: rotateLeft 2s ease-in-out forwards;
    }
    @keyframes rotateLeft {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(-15deg); }
      100% { transform: rotate(0deg); }
    }

    /* Animasi Fade */
    .fade {
      animation: fadeImg 2s ease-in-out forwards;
    }
    @keyframes fadeImg {
      0%   { opacity: 1; }
      50%  { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Gambar target -->
  <div class="text-center mt-3">
    <img id="targetImage" src="bsr.jpeg" class="rounded" alt="...">
  </div>

  <script>
    function triggerAnim() {
      const img = document.getElementById("targetImage");

      // Pilih animasi acak untuk gambar
      const animations = ["zoom", "rotate-right", "rotate-left", "fade"];
      const chosen = animations[Math.floor(Math.random() * animations.length)];

      img.classList.add(chosen);

      // Hapus class setelah animasi selesai agar bisa dipicu lagi
      setTimeout(() => {
        img.classList.remove(chosen);
      }, 2000);
    }
  </script>
