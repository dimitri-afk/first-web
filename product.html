      color: red;
    }

  <script>
    const kata = document.querySelector('.kata');

    kata.addEventListener('click', () => {
      // Tambahkan class animasi
      kata.classList.add('animasi');

      // Hapus class animasi setelah 500ms agar bisa diklik lagi
      setTimeout(() => {
        kata.classList.remove('animasi');
      }, 500);
    });
